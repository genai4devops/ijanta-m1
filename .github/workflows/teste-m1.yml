# Teste temporário do template do M1. Sai do branch antes do merge.
name: teste-m1

on:
  push:
    branches: [ccr-f973af66-g57ubq]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: genai4devops/clc16
          ref: ccr-f973af66-g57ubq
          path: hub
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov==3.4.6

      - name: Nenhuma solução dentro de labs/
        run: |
          ! grep -rn '<details>' labs/
          ! grep -rn 'aws_s3_bucket_versioning"' labs/

      - name: Lab 0 · validate barra o auto_encrypt e aceita o resto
        working-directory: labs/lab0-s3-generico
        run: |
          terraform init -backend=false -input=false -no-color
          if terraform validate -no-color > out.txt 2>&1; then cat out.txt; echo "::error::esperava falha"; exit 1; fi
          cat out.txt
          grep -q 'Unsupported argument' out.txt
          grep -q 'auto_encrypt' out.txt
          sed -i '/auto_encrypt/d' s3_generico.tf
          terraform validate -no-color

      - name: Lab 2 · Checkov acusa 9 falhas na policy legada
        run: |
          checkov -f iam_policy.tf --compact --quiet -o json > legado.json || true
          FALHAS=$(jq '.summary.failed' legado.json)
          jq -r '.results.failed_checks[].check_id' legado.json | sort
          test "$FALHAS" -eq 9

      - name: Monta as soluções dos READMEs na raiz
        run: python .github/teste/extrair.py . hub

      - name: Soluções · init, validate e tflint
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
          rm -rf hub
          tflint --init
          tflint --format compact

      - name: Lab 1 · checklist no Checkov
        run: checkov -f s3_comprovantes.tf --compact --check CKV_AWS_21,CKV_AWS_19,CKV2_AWS_6,CKV_AWS_20

      - name: Lab 2 · curinga eliminado
        run: checkov -f iam_policy.tf --compact --check CKV_AWS_62,CKV_AWS_63,CKV_AWS_355,CKV_AWS_286,CKV_AWS_287,CKV_AWS_288,CKV_AWS_289,CKV_AWS_290,CKV2_AWS_40

      - name: Lab 3 · AZs fixas e NAT no EIP
        run: |
          grep -q '"us-east-1a", "us-east-1b"' vpc.tf
          grep -q 'allocation_id = aws_eip.nat.id' vpc.tf
          ! grep -q 'output ' vpc.tf

  opencode-json:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - name: opencode.json contra o schema publicado
        run: check-jsonschema --schemafile https://opencode.ai/config.json opencode.json

  devcontainer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build do devcontainer e versões das ferramentas
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -e
            terraform version
            tflint --version
            opencode --version
            checkov --version
            git --version
            docker --version

  ministack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: genai4devops/clc16
          ref: ccr-f973af66-g57ubq
          path: hub
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Sobe o MiniStack
        run: |
          docker run -d --name ministack -p 4566:4566 ministackorg/ministack
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:4566 && break; sleep 2; done
      - name: Desafio B · plan, apply, conferência e destroy do bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python .github/teste/extrair.py . hub
          cp labs/desafio/ministack/provider_override.tf.exemplo provider_override.tf
          terraform init -input=false -no-color
          ALVOS="-target=aws_s3_bucket.comprovantes -target=aws_s3_bucket_versioning.comprovantes -target=aws_s3_bucket_public_access_block.comprovantes -target=aws_s3_bucket_server_side_encryption_configuration.comprovantes"
          terraform plan -no-color -input=false $ALVOS -out=plan.out
          terraform apply -no-color -input=false plan.out
          aws --endpoint-url http://localhost:4566 s3api get-bucket-versioning --bucket ijanta-comprovantes-dev | tee v.json
          jq -e '.Status == "Enabled"' v.json
          aws --endpoint-url http://localhost:4566 s3api get-public-access-block --bucket ijanta-comprovantes-dev | tee p.json
          jq -e '.PublicAccessBlockConfiguration | .BlockPublicAcls and .BlockPublicPolicy and .IgnorePublicAcls and .RestrictPublicBuckets' p.json
          terraform destroy -no-color -input=false -auto-approve $ALVOS
